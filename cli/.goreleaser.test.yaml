# =============================================================================
# GoReleaser config — test environment
#
# Usage:
#   goreleaser build --snapshot --clean --config .goreleaser.test.yaml
#     → PR trigger: verify compilation only, no packaging or publishing
#
#   goreleaser release --clean --skip=publish --config .goreleaser.test.yaml
#     → manual trigger (non-release version): build + package + store to dist/, no publish
#
#   goreleaser release --clean --config .goreleaser.test.yaml
#     → manual trigger (release version): build + publish GitHub Release
#
# Differences from prod:
#   - only the ldflags-injected test addresses differ
#   - release / before.hooks are identical (release versions need baked scripts)
#
# Note: after.hooks is a GoReleaser Pro feature, unsupported in the OSS build.
# GitCode upload is a separate workflow step (post-release.sh).
# =============================================================================
version: 2

project_name: devbox

before:
  hooks:
    - go test ./...
    # Bake install scripts: inject version + GitHub Release URL
    - ./scripts/bake-install.sh {{ .Version }} "https://github.com/huaweicloud/devspace-devbox/releases/download/{{ .Version }}"

builds:
  - id: devbox
    main: ./cmd/devbox
    binary: devbox_{{ .Os }}_{{ .Arch }}_{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/huaweicloud/devspace-devbox/cli/cmd.Version={{ .Version }}
      - -X github.com/huaweicloud/devspace-devbox/cli/internal/config.DefaultServer=https://devbox-test.developer.myhuaweicloud.com
      - -X github.com/huaweicloud/devspace-devbox/cli/internal/config.LoginURL=https://devstation.connect.huaweicloud.com
      - -X github.com/huaweicloud/devspace-devbox/cli/internal/config.AuthCheckDomain=https://bridge.developer.myhuaweicloud.com
    flags:
      - -trimpath
    buildmode: pie

archives:
  - formats:
      - tar.gz
    # Align with install.sh: devbox_{os}_{arch}_{version}[.exe].tar.gz
    # Note: no .tar.gz suffix here; GoReleaser appends it based on `formats`
    name_template: >-
      devbox_{{ .Os }}_{{ .Arch }}_{{ .Version }}{{ if eq .Os "windows" }}.exe{{ end }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git

release:
  github:
    owner: huaweicloud
    name: devspace-devbox
  # Baked install scripts as extra release assets
  extra_files:
    - glob: ./dist-extra/install.sh
    - glob: ./dist-extra/install.ps1
  draft: false
  prerelease: false
  name_template: "devbox-cli-{{ replace .Version \"-release\" \"\" }}"
