# golangci-lint configuration for cli.
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    rules:
      # The hand-maintained API client mirrors the API contract's camelCase
      # naming, so Go naming/format style checks are skipped for it.
      - path: internal/api/client\.go
        linters:
          - errcheck
          - staticcheck
          - unused

formatters:
  enable:
    - gofmt