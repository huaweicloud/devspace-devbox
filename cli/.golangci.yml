# golangci-lint configuration for cli.
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt

issues:
  exclude-rules:
    # Generated OpenAPI client.
    - path: internal/api/client\.gen\.go
      linters:
        - errcheck
        - staticcheck
        - unused