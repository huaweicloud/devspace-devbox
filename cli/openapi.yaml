openapi: 3.0.3
info:
  title: DevBox Manager API
  version: 1.0.0
  description: Creates sandboxes and manages their lifecycle and connection credentials.
servers:
  - url: https://localhost:8080
security:
  - ApiKeyAuth: []
paths:
  /templates:
    get:
      operationId: listTemplates
      responses:
        "200":
          description: Latest usable build of each public template
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Template"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /sandboxes:
    get:
      operationId: listSandboxes
      parameters:
        - {name: metadata, in: query, schema: {type: string}}
        - name: state
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: "#/components/schemas/SandboxState"}
        - {name: nextToken, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Sandboxes
          headers:
            X-Next-Token: {schema: {type: string}}
            X-Total-Running: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewSandbox"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /sandboxes/{sandboxID}:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    get:
      operationId: getSandbox
      responses:
        "200":
          description: Sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteSandbox
      responses:
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /sandboxes/{sandboxID}/connect:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: connectSandbox
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TimeoutOption"}
      responses:
        "200":
          description: Running sandbox connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "201":
          description: Resumed sandbox connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sandboxes/{sandboxID}/pause:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: pauseSandbox
      responses:
        "204": {description: Paused}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sandboxes/{sandboxID}/resume:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: resumeSandbox
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TimeoutOption"}
      responses:
        "201":
          description: Resumed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sandboxes/{sandboxID}/timeout:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: setSandboxTimeout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TimeoutOption"}
      responses:
        "204": {description: Timeout replaced}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /sandboxes/{sandboxID}/refreshes:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: refreshSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: {type: integer, format: int32, minimum: 10, maximum: 86400}
      responses:
        "204": {description: Lifetime extended}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    SandboxID:
      name: sandboxID
      in: path
      required: true
      schema: {type: string}
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
    SandboxState:
      type: string
      enum: [running, paused]
    SandboxLifecycle:
      type: object
      required: [onTimeout, autoResume]
      properties:
        onTimeout:
          type: string
          enum: [kill, pause]
          default: kill
        autoResume: {type: boolean, default: false}
    NewSandbox:
      type: object
      required: [templateID]
      properties:
        templateID: {type: string}
        buildID: {type: string, description: Optional pinned build; defaults to the latest build of the selected template.}
        timeout: {type: integer, format: int32, minimum: 10, maximum: 86400, default: 300}
        envVars:
          type: object
          additionalProperties: {type: string}
        metadata:
          type: object
          additionalProperties: {type: string}
        lifecycle: {$ref: "#/components/schemas/SandboxLifecycle"}
    TimeoutOption:
      type: object
      properties:
        timeout: {type: integer, format: int32, minimum: 10, maximum: 86400}
    Sandbox:
      type: object
      required: [sandboxID, templateID, state, startedAt, endAt, cpuCount, memoryMB, diskSizeMB, lifecycle]
      properties:
        sandboxID: {type: string}
        templateID: {type: string}
        state: {$ref: "#/components/schemas/SandboxState"}
        startedAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time, nullable: true, description: Running deadline. Null while paused; paused sandboxes have no Manager retention deadline.}
        cpuCount: {type: integer, format: int32}
        memoryMB: {type: integer, format: int32}
        diskSizeMB: {type: integer, format: int32}
        metadata:
          type: object
          additionalProperties: {type: string}
        lifecycle: {$ref: "#/components/schemas/SandboxLifecycle"}
        domain: {type: string, description: Complete EnvD HTTPS endpoint for this sandbox. Paused sandboxes do not include connection credentials.}
        tunnelId: {type: string}
        connectToken: {type: string, readOnly: true}
        tokenExpiration: {type: integer, format: int64}
    Template:
      type: object
      required: [templateID, name, aliases, buildID, cpuCount, memoryMB, diskSizeMB]
      properties:
        templateID: {type: string}
        name: {type: string}
        aliases:
          type: array
          items: {type: string}
        buildID: {type: string}
        cpuCount: {type: integer, format: int32}
        memoryMB: {type: integer, format: int32}
        diskSizeMB: {type: integer, format: int32}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Invalid API key
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: API key scope must be devbox
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: Compute capacity or a required service is unavailable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Sandbox not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Sandbox state conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Sandbox quota or request rate exceeded
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
