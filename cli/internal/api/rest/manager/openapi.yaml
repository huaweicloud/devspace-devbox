openapi: 3.0.3
info:
  title: DevBox Service API
  version: 1.0.0
  description: >-
    Creates sandboxes and manages their lifecycle and connection credentials.
    E2B clients may use /v2/sandboxes for create/list and /v2/sandboxes/{sandboxID}/connect.
    E2B responses use the stable tunnel alias as sandboxID and the proxy base hostname as domain.
servers:
  - url: https://localhost:8080
security:
  - ApiKeyAuth: []
paths:
  /templates:
    get:
      operationId: listTemplates
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 0, maximum: 1000}}
        - {name: nextToken, in: query, schema: {type: string}}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "200":
          description: Latest usable build of each public template
          headers:
            X-Next-Token: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Template"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /sandboxes:
    get:
      operationId: listSandboxes
      parameters:
        - {name: template, in: query, description: Template ID or alias, schema: {type: string}}
        - {name: metadata, in: query, schema: {type: string}}
        - {name: startedAfter, in: query, schema: {type: string, format: date-time}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - name: state
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: "#/components/schemas/SandboxState"}
        - {name: nextToken, in: query, schema: {type: string}}
        - {name: limit, in: query, description: '0 means no limit', schema: {type: integer, minimum: 0, maximum: 1000}}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "200":
          description: Sandboxes
          headers:
            X-Next-Token: {schema: {type: string}}
            X-Total-Running: {schema: {type: integer}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewSandbox"}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /sandboxes/{sandboxID}:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    get:
      operationId: getSandbox
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "200":
          description: Sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteSandbox
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "204": {description: Deleted}
        "404": {$ref: "#/components/responses/NotFound"}
  /sandboxes/{sandboxID}/metrics:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    get:
      operationId: getSandboxMetrics
      description: Historical metrics of a sandbox, collected every 5 seconds. Omitted bounds default to the earliest sample / now.
      parameters:
        - {name: start, in: query, schema: {type: integer, format: int64}}
        - {name: end, in: query, schema: {type: integer, format: int64}}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "200":
          description: Metrics samples, oldest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SandboxMetricsPoint"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /sandboxes/{sandboxID}/connect:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: connectSandbox
      description: A timeout on a running sandbox only extends its deadline, up to 24 hours from the current execution start. Connecting without a timeout does not change the deadline.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TimeoutOption"}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "200":
          description: Running sandbox connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "201":
          description: Resumed sandbox connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sandboxes/{sandboxID}/pause:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: pauseSandbox
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "204": {description: Paused}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sandboxes/{sandboxID}/resume:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: resumeSandbox
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TimeoutOption"}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "201":
          description: Resumed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /sandboxes/{sandboxID}/timeout:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: setSandboxTimeout
      description: Replace the deadline, capped at 24 hours from the current execution start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeout]
              properties:
                timeout: {type: integer, format: int32, minimum: 10, maximum: 86400}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "204": {description: Timeout replaced}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /sandboxes/{sandboxID}/refreshes:
    parameters:
      - {$ref: "#/components/parameters/SandboxID"}
    post:
      operationId: refreshSandbox
      description: Extend the deadline without shortening it, capped at 24 hours from the current execution start for new extensions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: {type: integer, format: int32, minimum: 10, maximum: 86400}
      responses:
        "426": {$ref: "#/components/responses/UpgradeRequired"}
        "204": {description: Deadline extended or already sufficient}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    SandboxID:
      name: sandboxID
      in: path
      required: true
      schema: {type: string}
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
    SandboxState:
      type: string
      enum: [running, paused]
    SandboxLifecycle:
      type: object
      required: [onTimeout, autoResume]
      properties:
        onTimeout:
          type: string
          enum: [kill, pause]
          default: kill
        autoResume: {type: boolean, default: false}
    NewSandbox:
      type: object
      required: [templateID]
      properties:
        templateID: {type: string}
        buildID: {type: string, description: Optional pinned build; defaults to the latest build of the selected template.}
        timeout: {type: integer, format: int32, minimum: 10, maximum: 86400, default: 300}
        envVars:
          type: object
          additionalProperties: {type: string}
        metadata:
          type: object
          additionalProperties: {type: string}
        lifecycle: {$ref: "#/components/schemas/SandboxLifecycle"}
        autoPause: {type: boolean, description: E2B alias for lifecycle.onTimeout=pause}
        autoResume:
          description: E2B automatic resume configuration; also accepts a boolean.
          oneOf:
            - {type: boolean}
            - type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
        autoPauseMemory: {type: boolean, enum: [true], description: Only full memory snapshots are supported.}
        allow_internet_access: {type: boolean, enum: [true]}
        network:
          type: object
          additionalProperties: false
          properties:
            allowPublicTraffic: {type: boolean, default: true, description: Allow anonymous access to application ports; EnvD always requires authentication.}
    TimeoutOption:
      type: object
      properties:
        timeout: {type: integer, format: int32, minimum: 10, maximum: 86400}
        memory: {type: boolean, enum: [true]}
        resume: {type: boolean, default: true, description: Connect only; false refuses to wake a paused sandbox.}
    Sandbox:
      type: object
      required: [sandboxID, templateID, state, startedAt, endAt, cpuCount, memoryMB, diskSizeMB, lifecycle]
      properties:
        sandboxID: {type: string}
        templateID: {type: string}
        state: {$ref: "#/components/schemas/SandboxState"}
        startedAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time, nullable: true, description: Running deadline; after a successful pause, when the pause completed. Not a snapshot retention deadline.}
        cpuCount: {type: integer, format: int32}
        memoryMB: {type: integer, format: int32}
        diskSizeMB: {type: integer, format: int32}
        metadata:
          type: object
          additionalProperties: {type: string}
        lifecycle: {$ref: "#/components/schemas/SandboxLifecycle"}
        domain: {type: string, description: Complete EnvD HTTPS endpoint for this sandbox. Paused sandboxes do not include connection credentials.}
        tunnelId: {type: string}
        connectToken: {type: string, readOnly: true}
        tokenExpiration: {type: integer, format: int64}
        clientID: {type: string}
        envdVersion: {type: string}
        envdAccessToken: {type: string, readOnly: true}
        envdUrl: {type: string, readOnly: true}
    Template:
      type: object
      required: [templateID, name, aliases, buildID, cpuCount, memoryMB, diskSizeMB]
      properties:
        templateID: {type: string}
        name: {type: string}
        aliases:
          type: array
          items: {type: string}
        names:
          type: array
          items: {type: string}
        buildID: {type: string}
        cpuCount: {type: integer, format: int32}
        memoryMB: {type: integer, format: int32}
        diskSizeMB: {type: integer, format: int32}
    SandboxMetricsPoint:
      type: object
      required: [timestampUnix, cpuCount, cpuUsedPct, memTotal, memUsed, memCache, diskTotal, diskUsed]
      properties:
        timestamp: {type: string, format: date-time}
        timestampUnix: {type: integer, format: int64}
        cpuCount: {type: integer, format: int32}
        cpuUsedPct: {type: number, format: float}
        memTotal: {type: integer, format: int64}
        memUsed: {type: integer, format: int64}
        memCache: {type: integer, format: int64}
        diskTotal: {type: integer, format: int64}
        diskUsed: {type: integer, format: int64}
        cpuPossible: {type: integer, format: int32}
        cpuTarget: {type: integer, format: int32}
        cpuTargetAttempts: {type: integer, format: int32}
        cpuWritePendingMs: {type: integer, format: int64}
        envdVersion: {type: string}
  responses:
    UpgradeRequired:
      description: Client version is below the configured minimum; upgrade before retrying
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Invalid API key
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: API key scope must be devbox
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: Compute capacity or a required service is unavailable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Sandbox not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Sandbox state conflict
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Sandbox quota or request rate exceeded
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
